model:
  name: type_aware_pairwise_v1
  embedding_dim: 512
  category_count: 7
  category_vocab_size: 8
  category_padding_idx: 0
  category_embedding_dim: 32
  item_projection_dim: 256
  item_hidden_dim: 128
  pair_hidden_dim: 128
  output_hidden_dim: 16
  activation: relu
  dropout: 0.2
  aggregation: mean
  pair_symmetry: bidirectional_mean

data:
  min_items: 2
  max_items: 8

# Validation-AUC profile selected from the completed scorer diagnostics.
# Key decisions:
# - BCE only; ranking experiments are stopped.
# - Full FP32 training and validation.
# - Standard sample-level shuffled batches.
# - Do not early-stop before epoch 30 because the strongest prior FP32 run
#   continued improving near the previous 30-epoch ceiling.
training:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 256
  max_epochs: 60
  early_stopping_patience: 10
  early_stopping_min_epochs: 30
  early_stopping_min_delta: 0.0
  lr_scheduler: none
  gradient_clipping: none
  mixed_precision: false
  seed: 42

selection:
  primary_metric: roc_auc
  guardrail_metric: fitb_2way

confirmation:
  seeds:
    - 42
    - 43
    - 44
  canonical_seed: 42
