experiment:
  stage: S3.1-control
  name: s3_1_paired_ranking_balanced_init_60ep
  hypothesis: balanced category initialization and a 60-epoch ceiling improve the paired-ranking run without changing its objective or batching

model:
  name: type_aware_pairwise_v1
  embedding_dim: 512
  category_count: 7
  category_vocab_size: 8
  category_padding_idx: 0
  category_embedding_dim: 32
  # 1 / sqrt(32): expected category-vector norm is approximately 1,
  # matching the L2-normalized FashionCLIP input scale.
  category_embedding_init_std: 0.17677669529663687
  item_projection_dim: 256
  item_hidden_dim: 128
  pair_hidden_dim: 128
  output_hidden_dim: 16
  activation: relu
  dropout: 0.2
  aggregation: mean
  pair_symmetry: bidirectional_mean

data:
  min_items: 3
  max_items: 8

training:
  optimizer: adamw
  objective: bce_plus_paired_logistic
  paired_batching: true
  paired_ranking_weight: 0.5
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 256
  max_epochs: 60
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0
  lr_scheduler: none
  gradient_clipping: none
  mixed_precision: true
  seed: 42

selection:
  primary_metric: roc_auc
  guardrail_metric: fitb_2way

confirmation:
  seeds:
    - 42
  canonical_seed: 42
