experiment:
  name: s3_1_modernized_v5
  description: faithful S3.1 paired-ranking objective rerun under the current V5 regime
  ranking_weight: 0.50
  baseline_valid_roc_auc: 0.6905082489625538
  baseline_valid_fitb_2way: 0.7626970227670753
  baseline_mean_logit_margin: 1.0499372052358245
  baseline_median_logit_margin: 0.7358774170279503

model:
  name: type_aware_pairwise_v1
  embedding_dim: 512
  category_count: 7
  category_vocab_size: 8
  category_padding_idx: 0
  category_embedding_dim: 32
  item_projection_dim: 256
  item_hidden_dim: 128
  pair_hidden_dim: 128
  output_hidden_dim: 16
  activation: relu
  dropout: 0.2
  aggregation: mean
  pair_symmetry: bidirectional_mean

data:
  min_items: 3
  max_items: 8

# Modernized S3.1: keep the original S3.1 objective/batching, but inherit the
# current V5 initialization/training protocol. Category init is implemented in
# src/scorer/model.py as N(0, 1/sqrt(32)) after MLP construction.
training:
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 256
  max_epochs: 60
  early_stopping_patience: 10
  early_stopping_min_epochs: 30
  early_stopping_min_delta: 0.0
  lr_scheduler: none
  gradient_clipping: none
  mixed_precision: false
  seed: 42

selection:
  primary_metric: roc_auc
  guardrail_metric: fitb_2way

confirmation:
  seeds:
    - 42
    - 43
    - 44
  canonical_seed: 42
