name: Production inference integration

on:
  pull_request:
    paths:
      - "src/calibration/**"
      - "src/inference/**"
      - "src/diagnosis/**"
      - "src/scorer/**"
      - "artifacts/calibration/**"
      - "artifacts/checkpoints/**"
      - "configs/production_inference_v1.json"
      - "tests/test_calibration.py"
      - "tests/test_production_inference.py"
      - "requirements-runtime.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/inference-integration.yml"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt

      - name: Run calibration and production E2E tests
        run: python -m unittest tests.test_calibration tests.test_production_inference -v

      - name: Build deploy image
        run: docker build -t outfit-inference-v1 .

      - name: Start deploy image
        run: docker run -d --name outfit-inference-v1 -p 8000:8000 outfit-inference-v1

      - name: Health check
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs outfit-inference-v1
          exit 1

      - name: Container logs
        if: always()
        run: docker logs outfit-inference-v1 || true
