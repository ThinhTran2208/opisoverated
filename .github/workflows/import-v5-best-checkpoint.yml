name: Import V5 best checkpoint

on:
  push:
    paths:
      - '.github/workflows/import-v5-best-checkpoint.yml'

permissions:
  contents: write

jobs:
  import-checkpoint:
    if: github.event.head_commit.message == 'Stage V5 checkpoint import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download frozen V5 best.pt from Drive
        shell: bash
        run: |
          python -m pip install --quiet gdown
          mkdir -p artifacts/checkpoints/type_aware_pairwise_v1/final_val_auc_v5_seed42
          python -m gdown 'https://drive.google.com/uc?id=1eEuyp7lX74WZBWvEdH2yzJOk5TkJTak2' \
            -O artifacts/checkpoints/type_aware_pairwise_v1/final_val_auc_v5_seed42/best.pt
          echo '7b3d0b6e0d44e3de517565f5725ded198bbc762b02a4dece26a58ee145cfed9c  artifacts/checkpoints/type_aware_pairwise_v1/final_val_auc_v5_seed42/best.pt' | sha256sum -c -

      - name: Commit checkpoint to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/checkpoints/type_aware_pairwise_v1/final_val_auc_v5_seed42/best.pt
          git commit -m 'Add frozen V5 best scorer checkpoint'
          git push origin HEAD:main
